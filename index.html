<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriSales Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E">
<style>
:root{
  --green-900:#173626; --green-700:#1F4D36; --green-600:#276245; --green-500:#2F7A56;
  --green-100:#E4EEE7; --amber-600:#B9812E; --amber-100:#F5E9D6; --paper:#FAF9F4;
  --card:#FFFFFF; --ink-900:#20241F; --ink-600:#565F58; --ink-400:#8C948B; --line:#E4E1D6;
  --red-600:#B23A32; --red-100:#F6E2DF; --blue-600:#2B6CB0; --blue-100:#E3EDF7;
  --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
  --shadow-1: 0 1px 2px rgba(23,54,38,0.06), 0 1px 1px rgba(23,54,38,0.04);
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink-900);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;}
html{scroll-padding-top:var(--safe-top);}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-0.01em;}
p{margin:0;}
button,input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;}
#app{min-height:100%;display:flex;flex-direction:column;padding-top:var(--safe-top);}

.topbar{position:sticky;top:var(--safe-top);z-index:20;background:var(--green-700);color:#fff;
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-1);}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--amber-600);
