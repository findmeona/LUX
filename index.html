<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aethera® — Beyond Silence</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Instrument Serif -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <!-- Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --background: #FFFFFF;
      --foreground: #000000;
      --muted: #6F6F6F;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
      color: var(--foreground);
    }

    body {
      min-height: 100vh;
    }

    .font-display {
      font-family: 'Instrument Serif', serif;
    }

    .tracking-tight-custom {
      letter-spacing: -2.46px;
    }

    /* Fade Rise Animations */
    @keyframes fadeRise {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    .animate-fade-rise {
      animation: fadeRise 0.8s ease-out forwards;
    }

    .animate-fade-rise-delay {
      opacity: 0;
      animation: fadeRise 0.8s ease-out forwards;
      animation-delay: 0.2s;
    }

    .animate-fade-rise-delay-2 {
      opacity: 0;
      animation: fadeRise 0.8s ease-out forwards;
      animation-delay: 0.4s;
    }

    .hero-video {
      position: absolute;
      inset: auto 0 0 0;
      top: 300px;
      width: 100%;
      height: calc(100vh - 300px);
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.08s linear;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      filter: contrast(1.05) saturate(0.95);
    }

    .glass-blur {
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .btn-hover {
      transition:
        transform 0.3s ease,
        background 0.3s ease;
    }

    .btn-hover:hover {
      transform: scale(1.03);
    }

    .menu-link {
      transition: color 0.3s ease;
    }

    .menu-link:hover {
      color: #000000;
    }
  </style>
</head>

<body>

  <div class="relative min-h-screen w-full overflow-hidden bg-white">

    <!-- Video Background -->
    <video
      id="bgVideo"
      class="hero-video"
      muted
      autoplay
      playsinline
      preload="auto"
    >
      <source
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_083109_283f3553-e28f-428b-a723-d639c617eb2b.mp4"
        type="video/mp4"
      />
    </video>

    <!-- Gradient Overlay -->
    <div class="absolute inset-0 z-[1] bg-gradient-to-b from-white via-transparent to-white"></div>

    <!-- Navigation -->
    <header class="relative z-10">
      <nav class="flex items-center justify-between px-8 py-6 max-w-7xl mx-auto">

        <!-- Logo -->
        <div class="font-display text-3xl text-black tracking-tight">
          Aethera<sup class="text-sm align-super">®</sup>
        </div>

        <!-- Menu -->
        <div class="hidden md:flex items-center gap-10 text-sm font-normal">
          <a href="#" class="menu-link text-black">Home</a>
          <a href="#" class="menu-link text-[#6F6F6F]">Studio</a>
          <a href="#" class="menu-link text-[#6F6F6F]">About</a>
          <a href="#" class="menu-link text-[#6F6F6F]">Journal</a>
          <a href="#" class="menu-link text-[#6F6F6F]">Reach Us</a>
        </div>

        <!-- CTA -->
        <button
          class="btn-hover rounded-full px-6 py-2.5 text-sm bg-black text-white shadow-lg"
        >
          Begin Journey
        </button>

      </nav>
    </header>

    <!-- Hero Section -->
    <section
      class="relative z-10 flex flex-col items-center justify-center text-center px-6 pb-40"
      style="padding-top: calc(8rem - 75px);"
    >

      <!-- Headline -->
      <h1
        class="font-display text-5xl sm:text-7xl md:text-8xl max-w-7xl font-normal leading-none tracking-tight-custom animate-fade-rise"
        style="line-height: 0.95;"
      >
        Beyond
        <span class="italic text-[#6F6F6F]">silence,</span>
        <br />
        we build
        <span class="italic text-[#6F6F6F]">the eternal.</span>
      </h1>

      <!-- Description -->
      <p
        class="text-base sm:text-lg max-w-2xl mt-8 leading-relaxed text-[#6F6F6F] animate-fade-rise-delay"
      >
        Building platforms for brilliant minds, fearless makers,
        and thoughtful souls. Through the noise, we craft digital
        havens for deep work and pure flows.
      </p>

      <!-- Hero CTA -->
      <button
        class="btn-hover rounded-full px-14 py-5 text-base mt-12 bg-black text-white shadow-2xl animate-fade-rise-delay-2"
      >
        Begin Journey
      </button>

    </section>

  </div>

  <script>
    const video = document.getElementById('bgVideo');

    let animationFrame;

    const FADE_DURATION = 0.5;

    function animateVideoFade() {
      if (!video.duration) {
        animationFrame = requestAnimationFrame(animateVideoFade);
        return;
      }

      const current = video.currentTime;
      const duration = video.duration;

      let opacity = 1;

      // Fade In
      if (current < FADE_DURATION) {
        opacity = current / FADE_DURATION;
      }

      // Fade Out
      else if (current > duration - FADE_DURATION) {
        opacity = (duration - current) / FADE_DURATION;
      }

      opacity = Math.max(0, Math.min(1, opacity));

      video.style.opacity = opacity.toString();

      animationFrame = requestAnimationFrame(animateVideoFade);
    }

    video.addEventListener('loadedmetadata', () => {
      video.play();
      animateVideoFade();
    });

    // Seamless manual loop
    video.addEventListener('ended', async () => {
      video.style.opacity = '0';

      cancelAnimationFrame(animationFrame);

      await new Promise(resolve => setTimeout(resolve, 100));

      video.currentTime = 0;

      try {
        await video.play();
        animateVideoFade();
      } catch (err) {
        console.error(err);
      }
    });

    // Autoplay fallback
    video.play().catch(() => {
      document.addEventListener('click', () => {
        video.play();
      }, { once: true });
    });
  </script>

</body>
</html>
