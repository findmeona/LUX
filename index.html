<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Billing App</title><style>
body{
font-family:Arial,sans-serif;
background:#f5f7f5;
margin:0;
padding:15px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:#fff;
padding:15px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
margin-bottom:15px;
}

h1{
text-align:center;
color:#2E7D32;
}

input,select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#2E7D32;
color:white;
border:none;
border-radius:8px;
font-size:16px;
margin-top:8px;
}

button:hover{
opacity:.9;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
font-size:14px;
}

.total{
font-size:24px;
font-weight:bold;
color:#2E7D32;
text-align:center;
margin-top:15px;
}

.history-item{
padding:10px;
border-bottom:1px solid #ddd;
}
</style></head>
<body><div class="container"><h1>🌱 Agro Billing App</h1><div class="card"><label>Customer Name</label>
<input id="customer" placeholder="Enter customer name">

<label>Product</label>
<select id="product"></select>

<label>Packing Size</label>
<select id="packing"></select>

<label>Technical Name</label>
<input id="technical" readonly>

<label>Price</label>
<input id="price" readonly>

<label>Quantity</label>
<input id="qty" type="number">

<button onclick="addItem()">Add Product</button>

</div><div class="card"><h3>Bill Items</h3><table>
<thead>
<tr>
<th>#</th>
<th>Product</th>
<th>Qty</th>
<th>Price</th>
<th>Amount</th>
</tr>
</thead><tbody id="billBody"></tbody></table><div class="total">
Grand Total: ₹<span id="grandTotal">0</span>
</div><button onclick="saveBill()">Save Bill</button>

</div><div class="card"><h3>Bill History</h3><div id="history"></div></div></div><script>

const products = [

{
product:"Urea",
packing:"50kg",
technical:"Carbamide",
price:266
},

{
product:"Urea",
packing:"25kg",
technical:"Carbamide",
price:140
},

{
product:"DAP",
packing:"50kg",
technical:"Diammonium Phosphate",
price:1350
},

{
product:"NPK 20:20:0",
packing:"50kg",
technical:"Nitrogen Phosphorus Potassium",
price:1250
}

];

let billItems=[];

const productSelect=document.getElementById("product");
const packingSelect=document.getElementById("packing");

function loadProducts(){

const names=[
...new Set(products.map(p=>p.product))
];

productSelect.innerHTML="";

names.forEach(name=>{

const option=document.createElement("option");
option.value=name;
option.textContent=name;

productSelect.appendChild(option);

});

loadPacking();
}

function loadPacking(){

const selected=productSelect.value;

const filtered=
products.filter(
p=>p.product===selected
);

packingSelect.innerHTML="";

filtered.forEach(item=>{

const option=document.createElement("option");

option.value=item.packing;
option.textContent=item.packing;

packingSelect.appendChild(option);

});

fillDetails();
}

function fillDetails(){

const product=productSelect.value;
const packing=packingSelect.value;

const item=
products.find(
p=>p.product===product &&
p.packing===packing
);

if(item){

document.getElementById("technical").value=item.technical;
document.getElementById("price").value=item.price;

}
}

productSelect.addEventListener("change",loadPacking);
packingSelect.addEventListener("change",fillDetails);

function addItem(){

const product=productSelect.value;
const packing=packingSelect.value;
const technical=document.getElementById("technical").value;
const price=Number(document.getElementById("price").value);
const qty=Number(document.getElementById("qty").value);

if(!qty){
alert("Enter Quantity");
return;
}

const amount=qty*price;

billItems.push({
product,
packing,
technical,
qty,
price,
amount
});

renderBill();

document.getElementById("qty").value="";
}

function renderBill(){

const body=document.getElementById("billBody");

body.innerHTML="";

let total=0;

billItems.forEach((item,index)=>{

total+=item.amount;

body.innerHTML+=`
<tr>
<td>${index+1}</td>
<td>${item.product}</td>
<td>${item.qty}</td>
<td>${item.price}</td>
<td>${item.amount}</td>
</tr>
`;

});

document.getElementById("grandTotal").textContent=total;
}

function saveBill(){

const customer=
document.getElementById("customer").value;

if(customer===""){
alert("Enter customer name");
return;
}

if(billItems.length===0){
alert("Add product first");
return;
}

const bill={

invoice:
"AGR-"+Date.now(),

customer,

total:
document.getElementById("grandTotal").textContent

};

const history=
JSON.parse(
localStorage.getItem("agroBills") || "[]"
);

history.push(bill);

localStorage.setItem(
"agroBills",
JSON.stringify(history)
);

alert("Bill Saved");

billItems=[];

renderBill();

loadHistory();
}

function loadHistory(){

const history=
JSON.parse(
localStorage.getItem("agroBills") || "[]"
);

const box=
document.getElementById("history");

box.innerHTML="";

history.reverse().forEach(bill=>{

box.innerHTML+=`
<div class="history-item">
<b>${bill.invoice}</b><br>
${bill.customer}<br>
₹${bill.total}
</div>
`;

});
}

loadProducts();
loadHistory();

</script></body>
</html>
