<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Wedding Invitation Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* ===== BASE ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
background:radial-gradient(circle at top,#0b0f2a,#05060f);
color:white;
overflow-x:hidden;
}

/* ===== LAYOUT ===== */
.container{
display:flex;
flex-wrap:wrap;
min-height:100vh;
padding:40px;
gap:40px;
align-items:center;
justify-content:center;
}

/* ===== FORM ===== */
.form-box{
width:350px;
padding:25px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(20px);
border-radius:20px;
}

.form-box h2{
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:12px;
margin-bottom:12px;
border:none;
border-radius:10px;
outline:none;
background:rgba(255,255,255,0.08);
color:white;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:50px;
background:linear-gradient(45deg,#ff4d6d,#ffb703);
color:white;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

/* ===== 3D SCENE ===== */
.scene{
width:400px;
height:500px;
perspective:1000px;
display:flex;
align-items:center;
justify-content:center;
}

.card{
width:300px;
height:400px;
transform-style:preserve-3d;
transition:transform 0.6s;
position:relative;
}

.card:hover{
transform:rotateY(25deg) rotateX(10deg);
}

/* FRONT */
.front{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(145deg,#ff4d6d,#ffb703);
border-radius:20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
backface-visibility:hidden;
box-shadow:0 20px 60px rgba(255,77,109,0.4);
}

.front h1{
font-size:28px;
}

.front p{
margin-top:10px;
}

/* BACK */
.back{
position:absolute;
width:100%;
height:100%;
background:#0d0f1f;
border-radius:20px;
transform:rotateY(180deg);
backface-visibility:hidden;
padding:20px;
display:flex;
flex-direction:column;
justify-content:center;
gap:10px;
}

.tag{
padding:8px;
background:rgba(255,255,255,0.08);
border-radius:10px;
}

/* BUTTON */
.download{
margin-top:10px;
background:#00d4ff;
}

</style>
</head>

<body>

<div class="container">

<!-- FORM -->
<div class="form-box">
<h2>Wedding Invitation</h2>

<input id="groom" placeholder="Groom Name">
<input id="bride" placeholder="Bride Name">
<input id="date" placeholder="Wedding Date">
<textarea id="venue" placeholder="Venue"></textarea>

<button onclick="updateCard()">Generate Invitation</button>
<button class="download" onclick="downloadCard()">Download PDF</button>
</div>

<!-- 3D CARD -->
<div class="scene">

<div class="card" id="card">

<div class="front">
<h1 id="title">Wedding Invitation</h1>
<p>Tap to see details</p>
</div>

<div class="back">

<div class="tag" id="names">Couple Name</div>
<div class="tag" id="dateOut">Date</div>
<div class="tag" id="venueOut">Venue</div>

</div>

</div>

</div>

</div>

<!-- HTML2PDF LIB -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>

/* UPDATE CARD */
function updateCard(){

document.getElementById("names").innerText =
document.getElementById("groom").value +
" ❤️ " +
document.getElementById("bride").value;

document.getElementById("dateOut").innerText =
"Date: " + document.getElementById("date").value;

document.getElementById("venueOut").innerText =
"Venue: " + document.getElementById("venue").value;

}

/* DOWNLOAD PDF */
function downloadCard(){

const element = document.getElementById("card");

html2pdf()
.from(element)
.save("wedding-invitation.pdf");

}

/* AUTO 3D FLOAT */
let card=document.getElementById("card");

document.addEventListener("mousemove",(e)=>{

let x=(window.innerWidth/2 - e.clientX)/25;
let y=(window.innerHeight/2 - e.clientY)/25;

card.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`;

});

</script>

</body>
</html>
