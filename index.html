<!-- ===== MODAL ===== -->
<div id="glModal" class="gl-modal" hidden>
  <div class="gl-backdrop"></div>

  <div class="gl-content">
    <button id="closeBtn">✕</button>
    <button id="prevBtn">◀</button>
    <img id="modalImg">
    <button id="nextBtn">▶</button>
  </div>
</div>

<!-- ===== SCRIPT ===== -->
<script>
const items = document.querySelectorAll('.gallery-item');
const buttons = document.querySelectorAll('.gf-btn');
const modal = document.getElementById('glModal');
const modalImg = document.getElementById('modalImg');

let currentIndex = 0;
let images = [];

document.querySelectorAll('.gallery-box img').forEach((img, i) => {
  images.push(img.src);

  img.parentElement.addEventListener('click', () => {
    currentIndex = i;
    openModal();
  });

  img.parentElement.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      currentIndex = i;
      openModal();
    }
  });
});

function openModal() {
  modal.hidden = false;
  modalImg.src = images[currentIndex];
}

function closeModal() {
  modal.hidden = true;
}

function nextImg() {
  currentIndex = (currentIndex + 1) % images.length;
  modalImg.src = images[currentIndex];
}

function prevImg() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  modalImg.src = images[currentIndex];
}

document.getElementById('closeBtn').onclick = closeModal;
document.getElementById('nextBtn').onclick = nextImg;
document.getElementById('prevBtn').onclick = prevImg;
document.querySelector('.gl-backdrop').onclick = closeModal;
  <h2 class="section-title reveal-up">Our Creations</h2>

<div class="gallery-item reveal-up delay-1">

// FILTER
buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const filter = btn.dataset.filter;

    items.forEach(item => {
      if (filter === 'all' || item.dataset.category === filter) {
        item.style.display = 'block';
      } else {
        item.style.display = 'none';
      }
    });
  });
});
</script>
