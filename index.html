<!-- ===== GALLERY SECTION ===== -->
<section class="gallery-section" id="gallery">
  <div class="container">

    <h2 class="section-title">Our Creations</h2>

    <!-- FILTER -->
    <div class="gallery-filters">
      <button class="gf-btn active" data-filter="all">All</button>
      <button class="gf-btn" data-filter="wedding">Wedding</button>
      <button class="gf-btn" data-filter="baby">Baby</button>
      <button class="gf-btn" data-filter="griha">Griha</button>
      <button class="gf-btn" data-filter="cultural">Cultural</button>
    </div>

    <!-- GRID -->
    <div class="gallery-grid">

      <div class="gallery-item" data-category="wedding">
        <div class="gallery-box" tabindex="0">
          <img src="images/chhab.jpg" alt="">
        </div>
      </div>

      <div class="gallery-item" data-category="cultural">
        <div class="gallery-box" tabindex="0">
          <img src="images/shrifal.jpg" alt="">
        </div>
      </div>

      <div class="gallery-item" data-category="wedding">
        <div class="gallery-box" tabindex="0">
          <img src="images/vana.jpg" alt="">
        </div>
      </div>

      <div class="gallery-item" data-category="wedding">
        <div class="gallery-box" tabindex="0">
          <img src="images/mandap.jpg" alt="">
        </div>
      </div>

      <div class="gallery-item" data-category="baby">
        <div class="gallery-box" tabindex="0">
          <img src="images/chhathi.jpg" alt="">
        </div>
      </div>

      <div class="gallery-item" data-category="wedding">
        <div class="gallery-box" tabindex="0">
          <img src="images/lagna.jpg" alt="">
        </div>
      </div>

      <div class="gallery-item" data-category="griha">
        <div class="gallery-box" tabindex="0">
          <img src="images/kanku.jpg" alt="">
        </div>
      </div>

      <div class="gallery-item" data-category="cultural">
        <div class="gallery-box" tabindex="0">
          <img src="images/chunni.jpg" alt="">
        </div>
      </div>

      <div class="gallery-item" data-category="baby">
        <div class="gallery-box" tabindex="0">
          <img src="images/welcome.jpg" alt="">
        </div>
      </div>

    </div>
  </div>
</section>

<!-- ===== MODAL ===== -->
<div id="glModal" class="gl-modal" hidden>
  <div class="gl-backdrop"></div>

  <div class="gl-content">
    <button id="closeBtn">✕</button>
    <button id="prevBtn">◀</button>
    <img id="modalImg">
    <button id="nextBtn">▶</button>
  </div>
</div>

<!-- ===== SCRIPT ===== -->
<script>
const items = document.querySelectorAll('.gallery-item');
const buttons = document.querySelectorAll('.gf-btn');
const modal = document.getElementById('glModal');
const modalImg = document.getElementById('modalImg');

let currentIndex = 0;
let images = [];

document.querySelectorAll('.gallery-box img').forEach((img, i) => {
  images.push(img.src);

  img.parentElement.addEventListener('click', () => {
    currentIndex = i;
    openModal();
  });

  img.parentElement.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      currentIndex = i;
      openModal();
    }
  });
});

function openModal() {
  modal.hidden = false;
  modalImg.src = images[currentIndex];
}

function closeModal() {
  modal.hidden = true;
}

function nextImg() {
  currentIndex = (currentIndex + 1) % images.length;
  modalImg.src = images[currentIndex];
}

function prevImg() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  modalImg.src = images[currentIndex];
}

document.getElementById('closeBtn').onclick = closeModal;
document.getElementById('nextBtn').onclick = nextImg;
document.getElementById('prevBtn').onclick = prevImg;
document.querySelector('.gl-backdrop').onclick = closeModal;

// FILTER
buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const filter = btn.dataset.filter;

    items.forEach(item => {
      if (filter === 'all' || item.dataset.category === filter) {
        item.style.display = 'block';
      } else {
        item.style.display = 'none';
      }
    });
  });
});
</script>
