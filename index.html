<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>

<body>

<section class="gallery">
  <h2 class="title">Our Creations</h2>

  <!-- FILTER -->
  <div class="filters">
    <button class="btn active" data-filter="all">All</button>
    <button class="btn" data-filter="wedding">Wedding</button>
    <button class="btn" data-filter="baby">Baby</button>
    <button class="btn" data-filter="griha">Griha</button>
  </div>

  <!-- GRID -->
  <div class="grid">

    <!-- 1 -->
   <div class="item"
     data-images="https://picsum.photos/500/300?1,https://picsum.photos/500/300?11,https://picsum.photos/500/300?21">
  <img src="https://picsum.photos/400/300?1">
</div>

    <!-- 2 -->
    <div class="item" data-category="baby"
         data-images="https://picsum.photos/500/300?2,https://picsum.photos/500/300?12">
      <img src="https://picsum.photos/400/300?2">
    </div>

    <!-- 3 -->
    <div class="item" data-category="griha"
         data-images="https://picsum.photos/500/300?3,https://picsum.photos/500/300?13">
      <img src="https://picsum.photos/400/300?3">
    </div>

    <!-- 4 -->
    <div class="item" data-category="wedding"
         data-images="https://picsum.photos/500/300?4,https://picsum.photos/500/300?14">
      <img src="https://picsum.photos/400/300?4">
    </div>

    <!-- 5 -->
    <div class="item" data-category="baby"
         data-images="https://picsum.photos/500/300?5,https://picsum.photos/500/300?15">
      <img src="https://picsum.photos/400/300?5">
    </div>

    <!-- 6 -->
    <div class="item" data-category="griha"
         data-images="https://picsum.photos/500/300?6,https://picsum.photos/500/300?16">
      <img src="https://picsum.photos/400/300?6">
    </div>

    <!-- 7 -->
    <div class="item" data-category="wedding"
         data-images="https://picsum.photos/500/300?7,https://picsum.photos/500/300?17">
      <img src="https://picsum.photos/400/300?7">
    </div>

  </div>
</section>

<!-- MODAL -->
<div class="modal" id="modal" hidden>
  <div class="backdrop"></div>

  <div class="modal-content glass">
    <img id="modalImg">

    <button id="prev">‹</button>
    <button id="next">›</button>
    <button id="close">✕</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
