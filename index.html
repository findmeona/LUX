<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriSales Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">🌾</div>
      <div class="brand-text">
        <div class="name" id="companyNameTop">AgriSales Manager</div>
        <div class="sub" id="topbarSub">Dashboard</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="backupBtn" title="Backup">☁️</button>
    </div>
  </div>

  <div class="shell">
    <div class="sidebar">
      <button class="side-link" data-page="dashboard"><span class="ic">📊</span>Dashboard</button>
      <button class="side-link" data-page="sales"><span class="ic">🧾</span>Sales</button>
      <button class="side-link" data-page="orders"><span class="ic">📦</span>Orders</button>
      <button class="side-link" data-page="inventory"><span class="ic">🏷️</span>Inventory</button>
      <div class="side-section">MANAGE</div>
