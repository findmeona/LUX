<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Premium Gallery</title>
  <link rel="stylesheet" href="style.css">

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>

<body>

<section class="gallery">

  <h2 class="title">Our Creations</h2>

  <!-- FILTER -->
  <div class="filters">
    <button class="btn active" data-filter="all">All</button>
    <button class="btn" data-filter="wedding">Wedding</button>
    <button class="btn" data-filter="baby">Baby</button>
    <button class="btn" data-filter="griha">Griha</button>
  </div>

  <!-- GRID -->
  <div class="grid">

    <div class="item" data-category="wedding">
      <img src="https://picsum.photos/400/300?1">
    </div>

    <div class="item" data-category="baby">
      <img src="https://picsum.photos/400/300?2">
    </div>

    <div class="item" data-category="griha">
      <img src="https://picsum.photos/400/300?3">
    </div>

    <div class="item" data-category="wedding">
      <img src="https://picsum.photos/400/300?4">
    </div>

  </div>
</section>

<!-- LIGHTBOX -->
<div class="modal" id="modal" hidden>
  <div class="backdrop"></div>

  <div class="modal-content glass">
    <img id="modalImg">

    <button id="prev">‹</button>
    <button id="next">›</button>
    <button id="close">✕</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
