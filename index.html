<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Billing App V4</title>
<link rel="stylesheet" href="style.css">
</head><body><div class="container"><header class="header">
<h1>🌱 Agro Billing App</h1>
</header><!-- DASHBOARD --><section class="card">
<h2>Dashboard</h2><div class="dashboard"><div class="dash-card">
<h3 id="totalBills">0</h3>
<p>Total Bills</p>
</div><div class="dash-card">
<h3 id="totalCustomers">0</h3>
<p>Customers</p>
</div><div class="dash-card">
<h3 id="totalProducts">0</h3>
<p>Products</p>
</div><div class="dash-card">
<h3 id="totalSales">₹0</h3>
<p>Total Sales</p>
</div></div>
</section><!-- COMPANY SETTINGS --><section class="card"><h2>Company Settings</h2><input id="companyName" placeholder="Company Name"><input id="companyAddress" placeholder="Address"><input id="companyMobile" placeholder="Mobile Number"><input id="companyGST" placeholder="GST Number"><input id="companyEmail" placeholder="Email"><button onclick="saveCompany()">
Save Company
</button></section><!-- PRODUCT MASTER --><section class="card"><h2>Product Master</h2><input id="productName" placeholder="Product Name"><input id="packingSize" placeholder="Packing Size"><input id="technicalName" placeholder="Technical Name"><input id="productPrice" type="number" placeholder="Price"><button onclick="addProduct()">
Add Product
</button><input id="productSearch"
placeholder="Search Product"
onkeyup="searchProducts()">

<table><thead>
<tr>
<th>Name</th>
<th>Packing</th>
<th>Price</th>
<th>Delete</th>
</tr>
</thead><tbody id="productTable"></tbody></table></section><!-- CUSTOMER MASTER --><section class="card"><h2>Customer Master</h2><input id="customerName"
placeholder="Party Name">

<input id="customerLocation"
placeholder="Location">

<input id="customerMobile"
placeholder="Mobile Number">

<button onclick="addCustomer()">
Add Customer
</button><table><thead>
<tr>
<th>Name</th>
<th>Location</th>
<th>Delete</th>
</tr>
</thead><tbody id="customerTable"></tbody></table></section><!-- BILLING --><section class="card"><h2>Create Bill</h2><label>Customer</label>

<select id="billCustomer"></select>

<label>Product</label>

<select id="billProduct"></select>

<label>Packing</label>

<select id="billPacking"></select>

<label>Technical Name</label>

<input id="billTechnical" readonly><label>Price</label>

<input id="billPrice" readonly><label>Quantity</label>

<input id="billQty" type="number"><button onclick="addBillItem()">
Add Item
</button><table><thead>
<tr>
<th>#</th>
<th>Product</th>
<th>Qty</th>
<th>Price</th>
<th>Amount</th>
<th>X</th>
</tr>
</thead><tbody id="billItems"></tbody></table><div class="grand-total">
Grand Total ₹
<span id="grandTotal">0</span>
</div><button onclick="saveBill()">
Save Bill
</button><button onclick="shareWhatsApp()">
WhatsApp Share
</button></section><!-- BILL HISTORY --><section class="card"><h2>Bill History</h2><input id="historySearch"
placeholder="Search Invoice">

<div id="historyContainer"></div></section><!-- BACKUP --><section class="card"><h2>Backup</h2><button onclick="exportBackup()">
Export Backup
</button><input type="file"
id="importFile">

<button onclick="importBackup()">
Import Backup
</button></section></div><script src="app.js"></script></body>
</html>
